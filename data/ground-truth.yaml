# conventions (assumed — flip if wrong):
#   rawness = production polish / primitiveness (0 = hyper-polished); not textural harshness
#   era     = one row per band, scored on the canonical album in the trailing comment
#   pre-registered rows are untouched; proposed revisions are in trailing comments

bands:
