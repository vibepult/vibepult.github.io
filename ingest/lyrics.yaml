# Metal Archives "Themes" -> lyric axes, the buttons of the Lyrics grid on the desk (one button per axis, pressed
# buttons are a union filter). A band is on an axis when any of its listed themes contains one of the axis keys
# (substring, lower case; era markers such as "(early)" are stripped). Edit, then: python -m ingest publish.
axes:
